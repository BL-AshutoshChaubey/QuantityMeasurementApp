version: "1"
services:
  - type: pserv
    name: mysql
    env: image
    image:
      url: mysql:8.0
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_DATABASE
        value: quantity_measurement
      - key: MYSQL_ROOT_PASSWORD
        value: tiger

  - type: pserv
    name: eureka-server
    env: docker
    dockerContext: .
    dockerfilePath: infrastructure/eureka-server/Dockerfile
    envVars:
      - key: PORT
        value: "8761"
      - key: EUREKA_CLIENT_REGISTER_WITH_EUREKA
        value: "false"
      - key: EUREKA_CLIENT_FETCH_REGISTRY
        value: "false"
      - key: EUREKA_INSTANCE_HOSTNAME
        value: "eureka-server"

  - type: pserv
    name: identity-service
    env: docker
    dockerContext: .
    dockerfilePath: services/identity-service/Dockerfile
    envVars:
      - key: PORT
        value: "8082"
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:mysql://mysql:3306/quantity_measurement"
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        value: "http://eureka-server:8761/eureka/"
      - key: EUREKA_INSTANCE_HOSTNAME
        value: "identity-service"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET_KEY
        sync: false

  - type: pserv
    name: measurement-service
    env: docker
    dockerContext: .
    dockerfilePath: services/measurement-service/Dockerfile
    envVars:
      - key: PORT
        value: "8081"
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:mysql://mysql:3306/quantity_measurement"
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        value: "http://eureka-server:8761/eureka/"
      - key: EUREKA_INSTANCE_HOSTNAME
        value: "measurement-service"
      - key: JWT_SECRET_KEY
        sync: false

  - type: web
    name: api-gateway
    env: docker
    dockerContext: .
    dockerfilePath: infrastructure/api-gateway/Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        value: "http://eureka-server:8761/eureka/"
      - key: EUREKA_INSTANCE_HOSTNAME
        value: "api-gateway"
